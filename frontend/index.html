<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用Agent</title>
    <script src="https://unpkg.com/vue@3"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <div class="app">
            <div class="header">
                <h1>🤖 通用Agent</h1>
            </div>

            <div class="session-controls">
                <div class="session-controls-left">
                    <button class="new-session-button" @click="newSession">➕ 新建会话</button>
                    
                    <!-- 会话ID按钮列表 -->
                    <div class="session-buttons">
                        <div 
                            v-for="session in sessions" 
                            :key="session"
                            class="session-button-wrapper"
                        >
                            <button 
                                :class="['session-button', { 'active': sessionId === session }]"
                                @click="switchSessionById(session)"
                                title="点击切换到会话: {{ session }}"
                            >
                                {{ session.slice(0, 8) }}...
                            </button>
                            <button 
                                class="delete-session-btn"
                                @click.stop="deleteSession(session)"
                                title="删除会话: {{ session }}"
                            >
                                ✕
                            </button>
                        </div>
                    </div>
                </div>
                <div class="session-controls-right">
                    <button @click="clearSession">清空当前会话</button>

                </div>
            </div>

            <div class="chat-container" ref="chatContainer">
                <div v-if="messages.length === 0" class="empty-state">
                    <h3>开始与Agent对话吧！</h3>
                    <p>输入您的问题或上传文件，Agent将为您提供帮助</p>
                </div>

                <div v-for="message in messages" :key="message.id"
                     :class="['message', message.type]">
                    <div :class="['avatar', message.type]">
                        {{ message.type === 'user' ? '👤' : '🤖' }}
                    </div>
                    <div :class="['bubble', message.type]">
                        <div class="streaming-content">
                            {{ message.content }}
                            <span v-if="message.streaming" class="cursor-blink"></span>
                        </div>
                        <div v-if="message.files && message.files.length" class="file-message">
                            <div v-for="file in message.files" :key="file.name" class="file-info">
                                📎 {{ file.name }} ({{ formatFileSize(file.size) }})
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <!-- 文件上传区域 -->
                <div class="file-upload-area">
                    <input
                        type="file"
                        ref="fileInput"
                        class="file-input"
                        multiple
                        @change="handleFileSelect"
                        accept=".txt,.pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.gif"
                    >
                    <button class="file-button" @click="triggerFileInput">
                        📎 选择文件
                    </button>
                    <span v-if="selectedFiles.length > 0" style="font-size: 12px; color: #6b7280;">
                        已选择 {{ selectedFiles.length }} 个文件
                    </span>
                </div>

                <!-- 文件列表 -->
                <div v-if="selectedFiles.length > 0" class="file-list">
                    <div v-for="(file, index) in selectedFiles" :key="index" class="file-item">
                        <span>📎 {{ file.name }}</span>
                        <span class="file-remove" @click="removeFile(index)">×</span>
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="input-row">
                    <input
                        v-model="inputText"
                        @keyup.enter="sendMessage"
                        placeholder="输入您的问题..."
                        :disabled="isLoading"
                    >
                    <button @click="sendMessage" :disabled="(!inputText && selectedFiles.length === 0) || isLoading">
                        {{ isLoading ? '发送中...' : '发送' }}
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
